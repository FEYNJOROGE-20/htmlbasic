<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>Tables</h1> 
    <p>Tables are a way to organize and display data in rows and columns. They are commonly used in web development to present information in a structured format.</p>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Country</th>
        </tr>
        <tr>
            <td>Jane, Smith</td>
            <td>25</td>
            <td>USA</td>
        </tr>
        <tr>
            <td>Michael, Johnson</td>
            <td>30</td>
            <td>Canada</td>
        </tr>
        <tr>
            <td>Emily, Davis</td>
            <td>28</td>
            <td>UK</td>
        </tr>
        <tr>
            <td>Faith,Waithera</td>
            <td>22</td>
            <td>Kenya</td>

    </table>
</body>
</html>
